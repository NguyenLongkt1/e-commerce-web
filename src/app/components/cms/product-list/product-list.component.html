<div class="col-md-12 p-1">
  <div class="col-md-12">
    <form [formGroup]="searchForm">
      <div class="row m-2">
        <div class="col-md-3">
          <input
            type="text"
            nz-input
            formControlName="name"
            placeholder="Tên sản phẩm"
          />
        </div>
        <div class="col-md-3">
          <input
            type="text"
            nz-input
            formControlName="code"
            placeholder="Mã sản phẩm"
          />
        </div>
        <div class="col-md-3">
          <nz-select
            formControlName="categoryId"
            nz-select
            nzShowSearch
            nzAllowClear
            nzPlaceHolder="Danh mục"
            (ngModelChange)="onCategoryChange($event)"
          >
            <nz-option
              [nzValue]="category.id"
              [nzLabel]="category.name"
              *ngFor="let category of lstCategory"
            ></nz-option>
          </nz-select>
        </div>
        <div class="col-md-3">
          <nz-select
            formControlName="shopId"
            nz-select
            nzShowSearch
            nzAllowClear
            nzPlaceHolder="Gian hàng"
            (ngModelChange)="onShopChange($event)"
          >
            <nz-option
              [nzValue]="shop.id"
              [nzLabel]="shop.shopName"
              *ngFor="let shop of lstShop"
            ></nz-option>
          </nz-select>
        </div>
      </div>
      <div class="row justify-content-center">
        <div class="col-md-3">
          <button
            nz-button
            nzType="default"
            class="me-1"
            (click)="doSearchData()"
          >
            <nz-icon nzType="search" />
            Tìm kiếm
          </button>

          <button nz-button nzType="primary" (click)="routeToAddPage()">
            <nz-icon nzType="plus" />
            Thêm mới
          </button>
        </div>
      </div>
    </form>
  </div>
  <div class="col-md-12 mt-2">
    <nz-table #basicTable [nzData]="listOfData">
      <thead>
        <tr>
          <th>Tên sản phẩm</th>
          <th>Mã sản phẩm</th>
          <th>Giá</th>
          <th>Danh mục</th>
          <th>Gian hàng</th>
          <th>Đánh giá</th>
          <th>Thao tác</th>
        </tr>
      </thead>
      <tbody>
        @for (data of basicTable.data; track data) {
        <tr>
          <td>{{ data.name }}</td>
          <td>{{ data.code }}</td>
          <td>{{ data.price }}</td>
          <td>{{ data.categoryName }}</td>
          <td>{{ data.shopName }}</td>
          <td>{{ data.rating }}</td>
          <td>
            <nz-icon
              (click)="viewDetail(data.id)"
              nzType="eye"
              nzTheme="outline"
              class="nz-icon-action"
            />
            <nz-divider nzType="vertical"></nz-divider>
            <nz-icon
              (click)="routeToEditPage(data.id)"
              nzType="edit"
              nzTheme="outline"
              style="color: green"
              class="nz-icon-action"
            />
            <nz-divider nzType="vertical"></nz-divider>
            <nz-icon
              (click)="deleteUser(data.id)"
              nzType="delete"
              nzTheme="outline"
              style="color: red"
              class="nz-icon-action"
            />
          </td>
        </tr>
        }
      </tbody>
    </nz-table>
  </div>
</div>
