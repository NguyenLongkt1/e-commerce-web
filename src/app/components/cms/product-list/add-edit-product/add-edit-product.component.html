<div class="col-md-12 p-1">
  <form [formGroup]="addEditForm">
    <div class="col-md-12 mb-5">
      <h2>Thêm mới sản phẩm</h2>
    </div>
    <div class="content">
      <div class="col-md-12 d-flex row-gap-1">
        <div class="col-md-12">
          <div class="row row-gap-3">
            <div class="col-md-4">
              <label>Tên sản phẩm <span class="text-danger">*</span></label>
              <input
                type="text"
                nz-input
                formControlName="name"
                placeholder="Tên sản phẩm"
                [ngClass]="isView ? 'disabled-input' : ''"
              />
            </div>
            <div class="col-md-4">
              <label>Mã sản phẩm <span class="text-danger">*</span></label>
              <input
                [ngClass]="isView ? 'disabled-input' : ''"
                type="text"
                nz-input
                formControlName="code"
                placeholder="Mã sản phẩm "
              />
            </div>
            <!-- <div class="col-md-4">
              <label>Mô tả sản phẩm <span class="text-danger">*</span></label>
              <input
                [ngClass]="isView ? 'disabled-input' : ''"
                type="text"
                nz-input
                formControlName="description"
                placeholder="Mô tả sản phẩm "
              />
            </div> -->
            <div class="col-md-4">
              <label>Giá sản phẩm <span class="text-danger">*</span></label>
              <input
                [ngClass]="isView ? 'disabled-input' : ''"
                type="number"
                nz-input
                formControlName="price"
                placeholder="Giá sản phẩm"
              />
            </div>
            <div class="col-md-4">
              <label>Danh mục <span class="text-danger">*</span></label>
              <nz-select
                [nzDisabled]="isView"
                formControlName="categoryId"
                nz-select
                nzShowSearch
                nzAllowClear
                nzPlaceHolder="Danh mục"
                (ngModelChange)="onCategoryChange($event)"
              >
                <nz-option
                  [nzValue]="category.id"
                  [nzLabel]="category.name"
                  *ngFor="let category of lstCategory"
                ></nz-option>
              </nz-select>
            </div>
            <div class="col-md-4">
              <label>Gian hàng <span class="text-danger">*</span></label>
              <nz-select
                [nzDisabled]="isView"
                formControlName="shopId"
                nz-select
                nzShowSearch
                nzAllowClear
                nzPlaceHolder="Gian hàng"
                (ngModelChange)="onShopChange($event)"
              >
                <nz-option
                  [nzValue]="shop.id"
                  [nzLabel]="shop.shopName"
                  *ngFor="let shop of lstShop"
                ></nz-option>
              </nz-select>
            </div>
            <div class="col-md-4">
              <label>Đánh giá</label>
              <input
                class="disabled-input"
                type="number"
                nz-input
                formControlName="rating"
              />
            </div>

            <div class="col-md-12">
              <label>Mô tả sản phẩm<span class="text-danger">*</span></label>
              <ckeditor [ngClass]="isView ? 'disabled-input' : ''" [editor]="Editor" [config]="config" formControlName="description"></ckeditor>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-12">
        <div class="row">
          <div class="col-md-12">
            <label>Ảnh sản phẩm</label>
            <app-upload-image
              [multiple]="true"
              [sizePx]="240"
              [isView]="isView"
              [lstFile]="lstFile"
              [ngClass]="isView ? 'disabled-input' : ''"
              (uploadEvent)="doChangeFile($event)"
              (deleteFileEvent)="doDeleteFile($event)"
            ></app-upload-image>
          </div>
        </div>
      </div>
      <div class="row justify-content-center mt-4">
        <div class="col-md-3">
          <button
            *ngIf="!id && !isView"
            nz-button
            nzType="primary"
            class="me-2"
            (click)="doCreateOrUpdateProduct()"
          >
            <nz-icon nzType="plus" />
            Thêm mới
          </button>
          <button
            *ngIf="id && !isView"
            nz-button
            nzType="primary"
            class="me-2"
            (click)="doCreateOrUpdateProduct()"
          >
            <nz-icon nzType="edit" />
            Cập nhật
          </button>
          <button nz-button nzType="default" class="me-1" (click)="back()">
            <nz-icon nzType="arrow-left" nzTheme="outline" />
            Quay lại
          </button>
        </div>
      </div>
    </div>
  </form>
</div>
